<style>
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;font-size:15px}
.panel[hidden]{display:none}
.kicker{font-size:13px;color:var(--muted);margin:0 0 4px}
.dots{display:flex;gap:6px;margin:0 0 12px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--surface2);transition:background .3s}
.dots i.on{background:var(--gold)}
.dots i.done{background:var(--teal)}
.step h3{font-size:19px;margin:0 0 6px}
.step p{margin:0 0 8px;font-size:15.5px}
.ref{font-size:13px;color:var(--muted);font-style:italic}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{flex:1}
.nav button[disabled]{opacity:.4}
svg#ch{display:block;width:100%;height:auto;margin:2px 0 8px}
svg#ch .part{cursor:pointer;outline:none}
svg#ch .part .hit{fill:transparent}
svg#ch .part:focus-visible .hit{stroke:var(--gold);stroke-width:2}
svg#ch .part.sel .shape{stroke:var(--gold);stroke-width:2.5}
.info h3{font-size:18px;margin:0 0 4px}
.info .what{margin:0 0 8px;font-size:15.5px}
.info .try{margin:0;padding:10px 12px;border-left:3px solid var(--gold);background:var(--surface2);border-radius:0 10px 10px 0;font-size:15px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 8px}
.close{margin:16px 0 0;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--gold);text-align:center}
.close small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:4px}
</style>

<div class="tabs" role="tablist">
  <button id="t1" role="tab" aria-selected="true">The story</button>
  <button id="t2" class="ghost" role="tab" aria-selected="false">The chariot</button>
</div>

<section id="p1" class="panel" role="tabpanel" aria-labelledby="t1">
  <p class="kicker" id="count">Step 1 of 5</p>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="step card" aria-live="polite">
    <h3 id="st"></h3>
    <p id="sx"></p>
    <p class="ref" id="sr"></p>
  </div>
  <div class="nav">
    <button id="back" class="ghost">Back</button>
    <button id="next">Next</button>
  </div>
</section>

<section id="p2" class="panel" role="tabpanel" aria-labelledby="t2" hidden>
  <p class="hint">Tap a part of the chariot.</p>
  <svg id="ch" viewBox="0 0 320 196" role="group" aria-label="The chariot of the Self">
    <g class="part" id="g-objects" tabindex="0" role="button" aria-label="The road: sense objects">
      <rect class="hit" x="0" y="160" width="320" height="36"/>
      <path class="shape" d="M4 176 H316" stroke="var(--muted)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
      <path d="M4 186 H316" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g class="part" id="g-senses" tabindex="0" role="button" aria-label="The horses: the senses">
      <rect class="hit" x="8" y="64" width="104" height="100"/>
      <g class="shape" fill="var(--teal)" stroke="var(--teal)" stroke-width="1">
        <ellipse cx="70" cy="116" rx="26" ry="13"/><path d="M92 112 L104 82 L116 86 L102 120z"/><ellipse cx="116" cy="82" rx="11" ry="6.5" transform="rotate(-20 116 82)"/>
        <path d="M54 126 L50 160 M64 128 L62 160 M80 128 L84 160 M90 124 L96 158" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>
      <g class="shape" fill="#2fb3b0" stroke="#2fb3b0" stroke-width="1" opacity=".85">
        <ellipse cx="38" cy="112" rx="24" ry="12"/><path d="M58 108 L68 82 L80 86 L66 114z"/><ellipse cx="80" cy="82" rx="10" ry="6" transform="rotate(-20 80 82)"/>
        <path d="M22 122 L18 158 M32 124 L30 158 M46 124 L50 158 M54 120 L60 156" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    <g class="part" id="g-mind" tabindex="0" role="button" aria-label="The reins: the mind">
      <path class="hit" d="M112 78 C140 70 170 74 196 98" stroke="transparent" stroke-width="18" fill="none"/>
      <path class="shape" d="M114 86 C140 84 160 90 190 106" stroke="var(--gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="shape" d="M114 90 C140 90 160 96 190 110" stroke="var(--gold)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    </g>
    <g class="part" id="g-body" tabindex="0" role="button" aria-label="The chariot: the body">
      <rect class="hit" x="150" y="96" width="140" height="68"/>
      <rect class="shape" x="170" y="112" width="112" height="34" rx="8" fill="var(--surface2)" stroke="var(--muted)" stroke-width="1.5"/>
      <g class="shape" fill="none" stroke="var(--muted)" stroke-width="3"><circle cx="196" cy="148" r="16"/><circle cx="256" cy="148" r="16"/></g>
      <g stroke="var(--muted)" stroke-width="1.5"><path d="M196 132V164M180 148H212M256 132V164M240 148H272"/></g>
    </g>
    <g class="part" id="g-intellect" tabindex="0" role="button" aria-label="The charioteer: the intellect">
      <rect class="hit" x="170" y="62" width="40" height="52"/>
      <circle class="shape" cx="188" cy="78" r="8" fill="var(--lotus)" stroke="var(--lotus)"/>
      <path class="shape" d="M188 86 V108 M188 94 L172 98" stroke="var(--lotus)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
    <g class="part" id="g-self" tabindex="0" role="button" aria-label="The rider: the Self">
      <rect class="hit" x="216" y="30" width="60" height="84"/>
      <circle cx="246" cy="76" r="26" fill="var(--gold)" opacity=".18"/>
      <circle cx="246" cy="76" r="17" fill="var(--gold)" opacity=".3"/>
      <path class="shape" d="M246 56 C256 68 258 78 246 96 C234 78 236 68 246 56z" fill="var(--gold)" stroke="var(--gold)" stroke-width="1"/>
      <path d="M246 112 V96" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="info card" aria-live="polite">
    <h3 id="it"></h3>
    <p class="what" id="iw"></p>
    <p class="try" id="ip"></p>
  </div>
  <p class="ref" style="margin:8px 2px 0">Katha Upanishad 1.3.3 to 1.3.9</p>
</section>

<p class="close">Arise, awake, and learn from the wise. The path is sharp as a razor's edge.<small>Katha Upanishad 1.3.14</small></p>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var steps=[
    ['A careless gift','A father, Vajashravasa, gives away old, worn-out cows as a sacrifice. His young son Nachiketa sees how hollow the gift is and asks, "Father, to whom will you give me?" Angered, the father says, "To Death."','Katha 1.1.1 to 1.1.4'],
    ['Three days at Death’s door','Yama is away, so Nachiketa waits three days without food. When Yama returns he honours the boy as a guest and offers three boons to make up for the wait.','Katha 1.1.7 to 1.1.10'],
    ['Three wishes','First: that his father be calm and welcome him home. Second: the knowledge of the sacred fire. Third, the great one: "When a person dies, does the Self remain, or not?"','Katha 1.1.10 to 1.1.20'],
    ['The great temptation','Yama tries to turn him aside with sons, cattle, gold, long life and every pleasure. Nachiketa answers that such things wear out the senses, and asks again for the truth alone.','Katha 1.1.21 to 1.1.29'],
    ['The teaching','Yama says two paths meet every person: the pleasant (preyas) and the good (shreyas). The wise choose the good. And the Self is never born and never dies, even when the body is slain.','Katha 1.2.1, 1.2.2 and 1.2.18']
  ];
  var i=0;
  function show(){
    var s=steps[i];
    $('st').textContent=s[0];$('sx').textContent=s[1];$('sr').textContent=s[2];
    $('count').textContent='Step '+(i+1)+' of '+steps.length;
    var d=$('dots').children;
    for(var k=0;k<d.length;k++){d[k].className=k<i?'done':(k===i?'on':'')}
    $('back').disabled=i===0;
    $('next').textContent=i===steps.length-1?'Begin again':'Next';
  }
  $('back').onclick=function(){if(i>0){i--;show()}};
  $('next').onclick=function(){i=(i+1)%steps.length;show()};
  show();

  var parts={
    self:['The Self, the rider','The one who is carried, and who knows. Not the body, not the mind, not the thoughts: the light by which all of them are seen.','Pause and ask: who is aware of this worry?'],
    body:['The body, the chariot','The vehicle for the journey. Worth caring for, but it is not who you are.','Rest, eat and move, and keep the body in service of the journey.'],
    intellect:['The intellect, the charioteer','Discernment. The one who steers, if it is awake.','Before you react, ask: is this the good, or only the pleasant?'],
    mind:['The mind, the reins','Held firm, the reins join the charioteer to the horses. Left slack, the horses run wherever they like.','Notice the pull before it becomes an action.'],
    senses:['The senses, the horses','Strong and eager. Good servants, poor masters.','Choose what you feed them: what you watch, hear and taste.'],
    objects:['The sense objects, the road','Sights, sounds and pleasures: the roads the horses run toward. The road is not the enemy; the charioteer chooses the route.','Walk the road. Do not be dragged along it.']
  };
  function pick(key){
    var p=parts[key];
    $('it').textContent=p[0];$('iw').textContent=p[1];$('ip').textContent=p[2];
    var all=document.querySelectorAll('#ch .part');
    for(var k=0;k<all.length;k++){all[k].classList.toggle('sel',all[k].id==='g-'+key)}
  }
  Object.keys(parts).forEach(function(key){
    var g=$('g-'+key);
    g.addEventListener('click',function(){pick(key)});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(key)}});
  });
  pick('self');

  function tab(n){
    $('p1').hidden=n!==1;$('p2').hidden=n!==2;
    $('t1').className=n===1?'':'ghost';$('t2').className=n===2?'':'ghost';
    $('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);
  }
  $('t1').onclick=function(){tab(1)};
  $('t2').onclick=function(){tab(2)};
})();
</script>
